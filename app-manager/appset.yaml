# ApplicationSet de producción.
# Lee cada archivo apps/prod/*.yaml y crea una Application por archivo.
# Para dar de alta una app nueva: agregar un archivo en apps/prod/ y hacer push.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps-prod
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/rijmjada/argocd-deploy.git
        revision: main
        files:
          - path: 'apps/prod/*.yaml'
      # Sólo genera las apps con enabled: "true" (entre comillas, se compara como texto).
      # Si ponés "false" o borrás el archivo, la Application desaparece.
      selector:
        matchLabels:
          enabled: "true"

  template:
    metadata:
      name: '{{ .name }}-prod'
      labels:
        env: prod
      # Al borrarse la Application, Argo CD elimina también sus recursos del cluster.
      # Sin esto quedarían huérfanos (deployment, service, etc. seguirían corriendo).
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default

      source:
        repoURL: '{{ .repoURL }}'
        targetRevision: '{{ .targetRevision }}'
        path: .
        helm:
          valueFiles:
            - values.yaml
            - '{{ .valuesFile }}'

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
