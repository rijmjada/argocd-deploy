# Única Application que se aplica a mano (una sola vez por cluster).
# Sincroniza la carpeta app-manager/, que contiene el ApplicationSet.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app-manager
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/rijmjada/argocd-deploy.git
    targetRevision: main
    path: app-manager

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
